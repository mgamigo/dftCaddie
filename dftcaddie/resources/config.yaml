# ============================================================
# dftCaddie — User Configuration File
# ============================================================
#
# This file allows you to customize:
#   • Pseudopotential locations
#   • Available clusters and SBATCH headers
#   • MPI launch commands
#   • Calculation kinds and templates
#
# You can safely edit this file.
# New calculation kinds, clusters, or headers can be added
# following the same structure shown below.
#
# User configuration directory:
#   ~/.config/dftcaddie/
# ============================================================


# ------------------------------------------------------------
# Pseudopotential locations
# ------------------------------------------------------------
# Absolute paths to your pseudopotential libraries.
# These folders must contain the raw QE / VASP pseudo files.

#qe_pslibrary: ~/Software/pslibrary
#vasp_pseudopotentials: ~/Software/vasp/pseudos


# ------------------------------------------------------------
# Cluster definitions
# ------------------------------------------------------------
# Each cluster entry defines:
#   hostname      → substring used to auto-detect the cluster
#   mpi_command   → MPI launcher prepended to mpi executables
#   headers       → Available SBATCH header presets
#
# Header files must exist in:
#   ~/.config/dftcaddie/sbatch_headers/
#
# "local" is used as fallback when no hostname matches.

clusters:
  local:
    hostname: ""
    mpi_command: "mpiexec -np 2"
    headers:
      - name: default
        file: local.default
  cluster1:
    hostname: "cluster1_hostname"
    mpi_command: "mpiexec -np $NPROCS"
    headers:
      - name: default
        file: cluster1.default
  cluster2:
    hostname: "cluster2_hostname"
    mpi_command: "srun --mpi=pmi2"
    headers:
      - name: default
        file: cluster2.default
      - name: long
        file: cluster2.long
      - name: small
        file: cluster2.small


# ------------------------------------------------------------
# MPI-aware executables
# ------------------------------------------------------------
# These executables will automatically receive the cluster's
# mpi_command prefix when generating scripts.

mpi_executables:
  - pw.x
  - projwfc.x
  - ph.x
  - fs.x
  - pw2wannier90.x
  - wannier90.x
  - vasp_ncl


# ------------------------------------------------------------
# Calculation definitions
# ------------------------------------------------------------
# Each calculation kind defines:
#   name    → Display label in CLI
#   config  → Interactive configuration options
#   files   → Required template files
#
# Template files must be located in:
#   ~/.config/dftcaddie/templates/<code>/
#
# Advanced users may extend this section.
# Incorrect edits may break CLI behavior.

calculations:
  bands:
    name: "[B]ands"
    config:
      - name: code
        prompt: "Available codes:"
        options:
          - quantum_espresso
          - vasp
      - name: soc
        prompt: "Spin–orbit coupling:"
        options:
          - true
          - false
        default: true
    files:
      quantum_espresso:
        - quantum_espresso/scf.sh
        - quantum_espresso/bands.sh
        - quantum_espresso/project_bands.sh
        - quantum_espresso/SYSTEM.INFO
        - quantum_espresso/master.sh
      vasp:
        - vasp/INCAR.SCC
        - vasp/INCAR.BS
        - vasp/KPOINTS.SCC
        - vasp/scf.sh
        - vasp/bands.sh
        - vasp/master.sh
  relax:
    name: "[R]elax"
    flavors:
      fixed_cell:
        name: "Fixed_cell"
        config:
          - name: code
            prompt: "Available codes:"
            options:
              - quantum_espresso
              - vasp
          - name: soc
            prompt: "Spin–orbit coupling:"
            options:
              - true
              - false
            default: false
          - name: cell_relaxation
            prompt: "Cell relaxation?"
            options:
              - false
        files:
          quantum_espresso:
            - quantum_espresso/relax.sh
            - quantum_espresso/SYSTEM.INFO
            - quantum_espresso/master.sh
          vasp:
            - vasp/INCAR.RELAX
            - vasp/KPOINTS.SCC
            - vasp/relax.sh
            - vasp/master.sh
      variable_cell:
        name: "Variable_cell"
        config:
          - name: code
            prompt: "Available codes:"
            options:
              - quantum_espresso
              - vasp
          - name: soc
            prompt: "Spin–orbit coupling:"
            options:
              - true
              - false
            default: false
          - name: cell_relaxation
            prompt: "Cell relaxation?"
            options:
              - true
        files:
          quantum_espresso:
            - quantum_espresso/relax.sh
            - quantum_espresso/SYSTEM.INFO
            - quantum_espresso/master.sh
          vasp:
            - vasp/INCAR.RELAX
            - vasp/KPOINTS.SCC
            - vasp/relax.sh
            - vasp/master.sh
  phonons:
    name: "[P]honons"
    config:
      - name: code
        prompt: "Available codes:"
        options:
          - quantum_espresso
      - name: soc
        prompt: "Spin–orbit coupling:"
        options:
          - true
          - false
        default: false
    files:
      quantum_espresso:
        - quantum_espresso/scf.sh
        - quantum_espresso/ph.sh
        - quantum_espresso/matdyn.sh
        - quantum_espresso/SYSTEM.INFO
        - quantum_espresso/master.sh


# ------------------------------------------------------------
# Global numerical defaults
# ------------------------------------------------------------
# Default parameters used when generating input files.
# These values are applied unless explicitly overwritten
# via CLI options.

# Target k-point density in kppra units.
# kppra = (number of k-points) × (number of atoms).
# Used when automatically generating Monkhorst–Pack grids.
default_kppra: 12000
# kppra ratio for non-self-consistent grids (x times more dense).
nscf_kppra_ratio: 4

# Safety factor applied to suggested plane-wave cutoffs
# read from pseudopotential headers.
# Final cutoff = suggested_cutoff × default_cutoff_ratio.
default_cutoff_ratio: 1.5



# ------------------------------------------------------------
# Suggested Quantum ESPRESSO pseudopotentials
# ------------------------------------------------------------
# Wildcard patterns used to select default pseudos from PSLibrary.
#
# Special placeholders:
#   $fct → exchange functional (pbe, pbesol, pz, ...)
#   *    → pseudo kind (kjpaw, us, ...)
#
# These patterns are used to automatically resolve
# preferred pseudopotentials for each element.

suggested_qe_pseudos:
  H: "H.$fct-*_psl.1.0.0"
  He: "He.$fct-*_psl.1.0.0"
  Li: "Li.$fct-sl-*_psl.1.0.0"
