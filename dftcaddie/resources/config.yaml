# ============================================================
# dftCaddie — User Configuration File
# ============================================================
#
# This file defines your calculation recipes and execution environment:
#   • Calculation kinds, flavors, settings, and templates
#   • Shared numerical defaults
#   • Clusters, MPI launch commands, and SBATCH headers
#   • Pseudopotential library locations
#
# Start by adapting a calculation definition, then configure the execution
# environment and pseudopotential sources. Run ``caddie config check
# --workflows`` after edits.
#
# User configuration directory:
#   ~/.config/dftcaddie/
# ============================================================


# ------------------------------------------------------------
# Calculation definitions
# ------------------------------------------------------------
# Each calculation kind defines:
#   name      → label displayed in the interactive client
#   config    → selectable settings; ``code`` is required
#   flavors   → complete workflow variants, when needed
#   files     → templates grouped by code
#
# ``code.options`` must match the keys under ``files`` exactly. Settings with a
# ``default`` are not prompted for unless ``caddie calc --details`` is used.
#
# Template paths are relative to ``templates/``. Include one ``master.sh`` in
# every code mapping. It is the submit-ready top-level script: caddie adds the
# selected SBATCH header and calls every other listed ``.sh`` file in order.
# ``master.sh`` never calls itself.
#
# A flavor has its own configuration and template mapping. For example, the
# two ``relax`` flavors below use different cell-relaxation settings.

calculations:
  bands:
    name: "Bands"
    config:
      - name: code
        prompt: "Select code:"
        options:
          - quantum_espresso
          - vasp
      - name: soc
        prompt: "Spin–orbit coupling:"
        options:
          - true
          - false
        default: true
    files:
      quantum_espresso:
        - quantum_espresso/scf.sh
        - quantum_espresso/bands.sh
        - quantum_espresso/project_kresolved.sh
        - quantum_espresso/SYSTEM.INFO
        - quantum_espresso/master.sh
      vasp:
        - vasp/INCAR.SCC
        - vasp/INCAR.BS
        - vasp/KPOINTS.SCC
        - vasp/scf.sh
        - vasp/bands.sh
        - vasp/master.sh
  relax:
    name: "Relax"
    flavors:
      fixed_cell:
        name: "Fixed cell"
        config:
          - name: code
            prompt: "Select code:"
            options:
              - quantum_espresso
              - vasp
          - name: soc
            prompt: "Spin–orbit coupling:"
            options:
              - true
              - false
            default: false
          - name: cell_relaxation
            prompt: "Cell relaxation?"
            options:
              - false
        files:
          quantum_espresso:
            - quantum_espresso/relax.sh
            - quantum_espresso/SYSTEM.INFO
            - quantum_espresso/master.sh
          vasp:
            - vasp/INCAR.RELAX
            - vasp/KPOINTS.SCC
            - vasp/relax.sh
            - vasp/master.sh
      variable_cell:
        name: "Variable cell"
        config:
          - name: code
            prompt: "Select code:"
            options:
              - quantum_espresso
              - vasp
          - name: soc
            prompt: "Spin–orbit coupling:"
            options:
              - true
              - false
            default: false
          - name: cell_relaxation
            prompt: "Cell relaxation?"
            options:
              - true
        files:
          quantum_espresso:
            - quantum_espresso/relax.sh
            - quantum_espresso/SYSTEM.INFO
            - quantum_espresso/master.sh
          vasp:
            - vasp/INCAR.RELAX
            - vasp/KPOINTS.SCC
            - vasp/relax.sh
            - vasp/master.sh
  phonons:
    name: "Phonons"
    config:
      - name: code
        prompt: "Select code:"
        options:
          - quantum_espresso
      - name: soc
        prompt: "Spin–orbit coupling:"
        options:
          - true
          - false
        default: false
    files:
      quantum_espresso:
        - quantum_espresso/scf.sh
        - quantum_espresso/ph.sh
        - quantum_espresso/matdyn.sh
        - quantum_espresso/SYSTEM.INFO
        - quantum_espresso/master.sh


# ------------------------------------------------------------
# Global numerical defaults
# ------------------------------------------------------------
# These numerical defaults are used by the system and pseudopotential helpers.
# They complement parameters stored in templates; they do not establish
# scientific convergence for a particular material.

# Target k-point density: kppra = number of k-points × number of atoms.
# Used by ``caddie set system --autokgrid`` and ``caddie calc --auto``.
default_kppra: 12000
# Multiplier for non-self-consistent grids relative to the self-consistent grid.
nscf_kppra_ratio: 4
# Multiplier for phonon q-grids relative to the self-consistent grid.
ph_kppra_ratio: 0.01

# Safety factor for cutoffs read from pseudopotential headers.
# Final cutoff = suggested cutoff × default_cutoff_ratio.
default_cutoff_ratio: 1.5


# ------------------------------------------------------------
# Cluster definitions
# ------------------------------------------------------------
# Each cluster entry defines:
#   hostname      → substring used to detect the cluster
#   mpi_command   → launcher prepended to configured MPI executables
#   headers       → available SBATCH header presets
#
# Header files are resolved from:
#   ~/.config/dftcaddie/sbatch_headers/
#
# ``local`` is the fallback when no hostname matches. During ``caddie calc``,
# the first header listed for the detected cluster is added to ``master.sh``.

clusters:
  local:
    hostname: ""
    mpi_command: "mpiexec -np $NPROCS"
    headers:
      - name: default
        file: local.default
  cluster1:
    hostname: "cluster1_hostname"
    mpi_command: "mpiexec -np $NPROCS"
    headers:
      - name: default
        file: cluster1.default
  cluster2:
    hostname: "cluster2_hostname"
    mpi_command: "srun --mpi=pmi2"
    headers:
      - name: default
        file: cluster2.default
      - name: long
        file: cluster2.long
      - name: small
        file: cluster2.small


# ------------------------------------------------------------
# MPI-aware executables
# ------------------------------------------------------------
# When one of these executables occurs in a generated shell script, caddie
# prepends the selected cluster's ``mpi_command``. Add executables used in your
# own templates here.

mpi_executables:
  - pw.x
  - projwfc.x
  - ph.x
  - fs.x
  - pw2wannier90.x
  - wannier90.x
  - vasp_ncl


# ------------------------------------------------------------
# Pseudopotential locations
# ------------------------------------------------------------
# VASP expects its exchange/kind subdirectories beneath this root.
#vasp_pseudopotentials: /path/to/vasp/potentials

# QE names are arbitrary identifiers, not physical metadata.
qe_pseudopotentials:
  defaults:
    scalar: pbesol-us-sr
    soc: pbesol-us-fr
  libraries:
    pbesol-us-sr:
      path: ~/Software/PSEUDOS/pslibrary/pbesol/PSEUDOPOTENTIALS
      pattern: "{element}.pbesol-*rrkjus_psl.*.UPF"
    pbesol-us-fr:
      path: ~/Software/PSEUDOS/pslibrary/rel-pbesol/PSEUDOPOTENTIALS
      pattern: "{element}.rel-pbesol-*rrkjus_psl.*.UPF"

# Optional element preferences, applied only to files already matching the
# selected library's pattern. These are filename globs: * covers provider
# naming differences, including the functional and pseudo kind. Preserve the
# version suffix. If no suggested file exists, use the library's normal matches.
# Explicit library overrides take precedence. Other providers need not match
# these PSLibrary suggestions; they can use their own patterns and overrides.
suggested_qe_pseudos:
  H: "H.*-*_psl.1.0.0.UPF"
  He: "He.*-*_psl.1.0.0.UPF"
  Li: "Li.*-sl-*_psl.1.0.0.UPF"
